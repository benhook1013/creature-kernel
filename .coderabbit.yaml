# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
inheritance: false
language: "en-US"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: false
    auto_incremental_review: false
    drafts: false
    labels: []
    description_keyword: ""

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"

chat:
  auto_reply: false
