[package]
name = "creature-kernel-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[features]
default = []
# Explicit experiment-only access to unfinished R3 numeric candidate APIs.
# This feature does not activate a profile, constants, or runtime semantics.
provisional-r3-numeric-candidate = []

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std", "float_roundtrip", "arbitrary_precision", "raw_value"] }
jsonschema = { version = "0.49.9", default-features = false }
num-bigint = { version = "0.4.8", default-features = false }
sha2 = { version = "0.10.9", default-features = false }

[lints]
workspace = true

[dev-dependencies]
num-rational = { version = "0.4.2", default-features = false, features = ["num-bigint", "std"] }
