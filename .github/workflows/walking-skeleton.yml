name: CK-KICK-010 walking skeleton

on:
  pull_request:
    paths:
      - "experiments/ck-kick-010-walking-skeleton/**"
      - ".github/workflows/walking-skeleton.yml"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ck-kick-010-tests:
    name: CK-KICK-010 walking skeleton tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
        working-directory: experiments/ck-kick-010-walking-skeleton

      - name: Run walking skeleton tests
        run: python -m pytest -q
        working-directory: experiments/ck-kick-010-walking-skeleton
