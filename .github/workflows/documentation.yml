name: Documentation contracts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Compile validator
        run: python3 -m py_compile dev-tools/validation/validate_docs.py

      - name: Validate documentation contracts
        run: python3 dev-tools/validation/validate_docs.py
