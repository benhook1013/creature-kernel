name: Rust workspace validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Show active Rust toolchain
        run: rustup show active-toolchain

      - name: Run Readiness 2 candidate preflight
        run: python3 dev-tools/fixture-preflight/preflight.py . fixtures/body-documents/readiness-2/manifest.v1.json

      - name: Fetch locked dependencies
        run: python3 dev-tools/readiness-evidence/evidence.py --fetch-locked .

      - name: Generate Readiness 2 candidate evidence
        run: python3 dev-tools/readiness-evidence/evidence.py .

      - name: Run sanitized bound core checks
        run: python3 dev-tools/readiness-evidence/evidence.py --run-bound-checks .

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Validate EXP-0002 candidate adapter
        run: |
          cargo fmt --manifest-path experiments/EXP-0002-numeric-frame-profile/candidate/Cargo.toml -- --check
          cargo test --manifest-path experiments/EXP-0002-numeric-frame-profile/candidate/Cargo.toml --locked
          cargo clippy --manifest-path experiments/EXP-0002-numeric-frame-profile/candidate/Cargo.toml --all-targets --locked -- -D warnings
