name: Rust workspace validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Show active Rust toolchain
        run: rustup show active-toolchain

      - name: Run Readiness 2 candidate preflight
        run: python3 dev-tools/fixture-preflight/preflight.py . fixtures/body-documents/readiness-2/manifest.v1.json

      - name: Fetch locked dependencies
        run: python3 dev-tools/readiness-evidence/evidence.py --fetch-locked .

      - name: Generate Readiness 2 candidate evidence
        run: python3 dev-tools/readiness-evidence/evidence.py .

      - name: Run sanitized bound core checks
        run: python3 dev-tools/readiness-evidence/evidence.py --run-bound-checks .

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Validate EXP-0002 candidate adapter
        run: |
          cargo fmt --manifest-path experiments/EXP-0002-numeric-frame-profile/candidate/Cargo.toml -- --check
          cargo test --manifest-path experiments/EXP-0002-numeric-frame-profile/candidate/Cargo.toml --locked
          cargo clippy --manifest-path experiments/EXP-0002-numeric-frame-profile/candidate/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run EXP-0002 runner synthetic checks
        run: |
          python3 -m py_compile experiments/EXP-0002-numeric-frame-profile/scripts/*.py
          PYTHONWARNINGS=error python3 -m unittest discover \
            -s experiments/EXP-0002-numeric-frame-profile/scripts \
            -p 'test*.py' \
            -v

      - name: Validate EXP-0002 phase-two development diagnostic
        run: |
          phase2_root=experiments/EXP-0002-numeric-frame-profile/phase2-authored-conflict
          cargo fmt --manifest-path "$phase2_root/candidate/Cargo.toml" -- --check
          cargo test --manifest-path "$phase2_root/candidate/Cargo.toml" --locked
          cargo clippy --manifest-path "$phase2_root/candidate/Cargo.toml" --all-targets --locked -- -D warnings
          python3 -m py_compile "$phase2_root"/scripts/*.py
          PYTHONWARNINGS=error python3 -m unittest discover \
            -s "$phase2_root/scripts" \
            -p 'test*.py' \
            -v
          cargo build --manifest-path "$phase2_root/candidate/Cargo.toml" --locked
          PYTHONPATH="$phase2_root/scripts" python3 "$phase2_root/scripts/run_development.py" \
            --candidate "$phase2_root/candidate/target/debug/exp-0002-r3-authored-conflict-candidate" \
            > "$RUNNER_TEMP/phase2-development-report.json"
          python3 -m json.tool "$RUNNER_TEMP/phase2-development-report.json" > /dev/null

      - name: Run EXP-0002 Phase 3 synthetic unit tests
        run: |
          PYTHONWARNINGS=error python3 -m unittest discover \
            -s experiments/EXP-0002-numeric-frame-profile/phase3-semantic-band-conformance/scripts \
            -p 'test_phase3_*.py' \
            -v
